<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Day</title>
<style>
  :root {
    --ink: #33303a;
    --pop: cubic-bezier(0.22, 1.28, 0.4, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 12% 8%, #fff6e2 0%, rgba(255, 246, 226, 0) 60%),
      radial-gradient(900px 600px at 88% 92%, #eaf4ff 0%, rgba(234, 244, 255, 0) 62%),
      #fffdf8;
  }

  /* ---------- 屏幕中间的文字 ---------- */
  .center {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
    padding: 0 16px;
  }

  .title {
    font-size: clamp(26px, 6vw, 46px);
    font-weight: 800;
    letter-spacing: 2px;
    color: #f0a4b8;
    text-shadow: 0 3px 0 #fff, 0 6px 18px rgba(240, 164, 184, 0.35);
    margin: 0 0 6px;
  }

  .message {
    font-size: clamp(17px, 3.9vw, 25px);
    font-weight: 700;
    line-height: 1.7;
    max-width: 20em;
    min-height: 3.4em;
    display: grid;
    place-items: center;
    text-shadow: 0 2px 0 #fff, 0 4px 14px rgba(255, 255, 255, 0.9);
  }

  .message span {
    grid-area: 1 / 1;
    opacity: 0;
  }

  .message span.on {
    animation: textWave 2600ms ease-in-out both;
  }

  @keyframes textWave {
    0%   { opacity: 0; transform: translateY(14px) scale(0.94); filter: blur(6px); }
    18%  { opacity: 1; transform: translateY(0) scale(1);      filter: blur(0); }
    72%  { opacity: 1; transform: translateY(0) scale(1);      filter: blur(0); }
    100% { opacity: 0; transform: translateY(-12px) scale(1.03); filter: blur(5px); }
  }

  /* ---------- 小狗们 ---------- */
  .dogs {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .dog {
    position: absolute;
    width: var(--size, 130px);
    height: auto;
    opacity: 0;
    will-change: transform, opacity;
    animation: dogWave 3200ms ease-in-out both;
    animation-delay: var(--delay, 0ms);
    pointer-events: auto;
    cursor: pointer;
    -webkit-user-drag: none;
    user-select: none;
  }

  @keyframes dogWave {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.35) rotate(var(--rot, 0deg)); }
    16%  { opacity: 1; transform: translate(-50%, -50%) scale(1.06) rotate(var(--rot, 0deg)); }
    28%  { opacity: 1; transform: translate(-50%, -50%) scale(1)    rotate(var(--rot, 0deg)); }
    62%  { opacity: 1; transform: translate(-50%, calc(-50% - 10px)) scale(1) rotate(var(--rot, 0deg)); }
    100% { opacity: 0; transform: translate(-50%, calc(-50% - 34px)) scale(0.92) rotate(var(--rot, 0deg)); }
  }

  /* 点一下小狗：蹦一下 */
  .dog.boing {
    animation: boing 560ms var(--pop) both;
  }
  @keyframes boing {
    0%   { transform: translate(-50%, -50%) scale(1); }
    35%  { transform: translate(-50%, -62%) scale(1.16) rotate(-6deg); }
    70%  { transform: translate(-50%, -46%) scale(0.96) rotate(5deg); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  /* ---------- 底部 ---------- */
  .foot {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 18px;
    z-index: 4;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  button {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 99px;
    padding: 9px 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 0 var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
  }
  button:hover  { background: #fff6e2; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 0 var(--ink); }
  button:focus-visible { outline: 3px solid #ffd9a0; outline-offset: 3px; }

  @media (max-width: 520px) {
    .message { font-size: 17px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dog { animation-duration: 1ms !important; opacity: 1; }
    .message span.on { animation-duration: 1ms !important; opacity: 1; }
  }
</style>
</head>
<body>

  <div class="dogs" id="dogs" aria-hidden="true"></div>

  <div class="center">
    <h1 class="title">生日快乐</h1>
    <div class="message" id="message" aria-live="polite"></div>
  </div>

  <div class="foot">
    <button id="more" type="button">再撒一波小狗</button>
    <button id="toggle" type="button">暂停</button>
  </div>

  const dogsLayer = document.getElementById("dogs");
  const messageBox = document.getElementById("message");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 文字 ---------- */
  const textNodes = MESSAGES.map((text) => {
    const span = document.createElement("span");
    span.textContent = text;
    messageBox.appendChild(span);
    return span;
  });
  let textIndex = 0;

  function showText(index) {
    textNodes.forEach((node, i) => {
      node.classList.toggle("on", i === index);
      if (i === index) {
        // 重启动画
        node.style.animation = "none";
        void node.offsetWidth;
        node.style.animation = "";
      }
    });
  }

  /* ---------- 小狗 ---------- */
  // 网格布点：每格最多一只，从结构上保证不重叠；并跳过中间文字区
  // sizePx 用于把小狗的半个身位算进边界，避免贴边被裁
  function pickSlots(count, sizePx) {
    const narrow = window.innerWidth < 620;
    const cols = narrow ? 3 : 4;
    const rows = narrow ? 4 : 3;

    const halfW = (sizePx / window.innerWidth) * 50;
    const halfH = (sizePx / window.innerHeight) * 50;
    const padX = EDGE_PAD + halfW;
    const padY = EDGE_PAD + halfH;

    const centerLeft = 50 - CENTER_SAFE.w / 2;
    const centerRight = 50 + CENTER_SAFE.w / 2;
    const centerTop = 50 - CENTER_SAFE.h / 2;
    const centerBottom = 50 + CENTER_SAFE.h / 2;

    const cells = [];
    for (let r = 0; r < rows; r += 1) {
      for (let c = 0; c < cols; c += 1) {
        const x0 = (100 / cols) * c;
        const y0 = (100 / rows) * r;
        const w = 100 / cols;
        const h = 100 / rows;

        // 与中间文字区重叠太多的格子直接放弃
        const overlapX = Math.min(x0 + w, centerRight) - Math.max(x0, centerLeft);
        const overlapY = Math.min(y0 + h, centerBottom) - Math.max(y0, centerTop);
        const overlapArea = Math.max(0, overlapX) * Math.max(0, overlapY);
        if (overlapArea > w * h * 0.35) continue;

        // 在格内抖动，然后夹到安全范围内（保证整只小狗都在屏幕内）
        const jitterX = (Math.random() - 0.5) * w * 0.55;
        const jitterY = (Math.random() - 0.5) * h * 0.55;
        const left = Math.min(100 - padX, Math.max(padX, x0 + w / 2 + jitterX));
        const top = Math.min(100 - padY, Math.max(padY, y0 + h / 2 + jitterY));

        cells.push({ x: left, y: top });
      }
    }

    // 洗牌后取前 count 个
    for (let i = cells.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [cells[i], cells[j]] = [cells[j], cells[i]];
    }
    return cells.slice(0, Math.max(1, Math.min(count, cells.length)));
  }

  function spawnWave() {
    if (dogsLayer.childElementCount > MAX_DOGS) return;

    const count = DOGS_PER_WAVE[0] + Math.floor(Math.random() * (DOGS_PER_WAVE[1] - DOGS_PER_WAVE[0] + 1));
    const scale = Math.min(1, Math.max(0.55, window.innerWidth / 1100));
    const sizes = Array.from({ length: count }, () =>
      (SIZE_RANGE[0] + Math.random() * (SIZE_RANGE[1] - SIZE_RANGE[0])) * scale);

    const slots = pickSlots(count, Math.max(...sizes));

    slots.forEach((slot, i) => {
      const image = document.createElement("img");
      image.className = "dog";
      image.src = IMAGES[Math.floor(Math.random() * IMAGES.length)];
      image.alt = "";
      image.draggable = false;

      image.style.setProperty("--size", sizes[i].toFixed(0) + "px");
      image.style.setProperty("--rot", ((Math.random() - 0.5) * 22).toFixed(1) + "deg");
      image.style.setProperty("--delay", (i * 130).toFixed(0) + "ms");
      image.style.left = slot.x.toFixed(2) + "%";
      image.style.top = slot.y.toFixed(2) + "%";

      image.addEventListener("animationend", (event) => {
        if (event.animationName === "dogWave" || event.animationName === "boing") {
          if (!image.classList.contains("boing")) image.remove();
        }
      });

      image.addEventListener("click", () => {
        image.classList.add("boing");
        setTimeout(() => image.classList.remove("boing"), 600);
      });

      dogsLayer.appendChild(image);
      setTimeout(() => image.remove(), DOG_LIFE_MS + 1200);
    });
  }

  /* ---------- 循环 ---------- */
  let running = true;
  let waveTimer = 0;
  let textTimer = 0;

  function start() {
    if (waveTimer || textTimer) return;
    waveTimer = setInterval(spawnWave, WAVE_GAP_MS);
    textTimer = setInterval(() => {
      textIndex = (textIndex + 1) % textNodes.length;
      showText(textIndex);
    }, TEXT_GAP_MS);
  }

  function stop() {
    clearInterval(waveTimer);
    clearInterval(textTimer);
    waveTimer = 0;
    textTimer = 0;
  }

  showText(0);
  spawnWave();
  setTimeout(spawnWave, 420);
  start();

  document.getElementById("more").addEventListener("click", () => {
    spawnWave();
    setTimeout(spawnWave, 260);
  });

  document.getElementById("toggle").addEventListener("click", (event) => {
    running = !running;
    event.currentTarget.textContent = running ? "暂停" : "继续";
    if (running) start();
    else stop();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stop();
    else if (running) start();
  });

  if (reduceMotion) stop();
})();
</script>
</body>
</html>
