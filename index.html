<title>Happy Day</title>
<style>
  :root {
    --cycle: 9s;
    --ink: #33303a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 12% 8%, #fff6e2 0%, rgba(255, 246, 226, 0) 60%),
      radial-gradient(900px 600px at 88% 92%, #eaf4ff 0%, rgba(234, 244, 255, 0) 62%),
      #fffdf8;
  }

  /* ---------- 小狗层：纯 CSS 循环，不依赖脚本 ---------- */
  .dogs {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .slot {
    position: absolute;
    width: var(--size);
    height: var(--size);
    margin-left: calc(var(--size) / -2);
    margin-top: calc(var(--size) / -2);
    animation: drift var(--cycle) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
    will-change: transform, opacity;
  }

  .slot img {
    width: 100%;
    height: 100%;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }

  @keyframes drift {
    0%   { opacity: 0;   transform: scale(0.55) translateY(14px); }
    12%  { opacity: 1;   transform: scale(1.05) translateY(0); }
    22%  { opacity: 1;   transform: scale(1) translateY(0); }
    58%  { opacity: 1;   transform: scale(1) translateY(calc(var(--drift) * -1)); }
    78%  { opacity: 0.35; transform: scale(0.98) translateY(calc(var(--drift) * -2)); }
    100% { opacity: 0;   transform: scale(0.9) translateY(calc(var(--drift) * -3)); }
  }

  /* ---------- 中间文字 ---------- */
  .center {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 18px;
    pointer-events: none;
  }

  .title {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 2px;
    margin: 0 0 4px;
    color: #f0a4b8;
    text-shadow: 0 3px 0 #fff, 0 6px 18px rgba(240, 164, 184, 0.35);
  }

  .message {
    position: relative;
    width: 100%;
    max-width: 22em;
    min-height: 3.2em;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.7;
  }

  .message span {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    animation: words var(--cycle) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes words {
    0%   { opacity: 0; }
    2%   { opacity: 1; }
    15%  { opacity: 1; }
    18%  { opacity: 0; }
    100% { opacity: 0; }
  }

  @media (max-width: 420px) {
    .title { font-size: 28px; }
    .message { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .slot { animation: none; opacity: 1; }
    .message span { animation: none; }
    .message span:first-child { opacity: 1; }
  }
</style>
</head>
