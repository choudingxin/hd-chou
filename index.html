<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="format-detection" content="telephone=no" />
<title>Happy Day</title>
<style>
  :root {
    --cycle: 9s;
    --ink: #33303a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 12% 8%, #fff6e2 0%, rgba(255, 246, 226, 0) 60%),
      radial-gradient(900px 600px at 88% 92%, #eaf4ff 0%, rgba(234, 244, 255, 0) 62%),
      #fffdf8;
  }

  /* ---------- 小狗层：纯 CSS 循环，不依赖脚本 ---------- */
  .dogs {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .slot {
    position: absolute;
    width: var(--size);
    height: var(--size);
    margin-left: calc(var(--size) / -2);
    margin-top: calc(var(--size) / -2);
    animation: drift var(--cycle) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
    will-change: transform, opacity;
  }

  .slot img {
    width: 100%;
    height: 100%;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }

  @keyframes drift {
    0%   { opacity: 0;   transform: scale(0.55) translateY(14px); }
    12%  { opacity: 1;   transform: scale(1.05) translateY(0); }
    22%  { opacity: 1;   transform: scale(1) translateY(0); }
    58%  { opacity: 1;   transform: scale(1) translateY(calc(var(--drift) * -1)); }
    78%  { opacity: 0.35; transform: scale(0.98) translateY(calc(var(--drift) * -2)); }
    100% { opacity: 0;   transform: scale(0.9) translateY(calc(var(--drift) * -3)); }
  }

  /* ---------- 中间文字 ---------- */
  .center {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 18px;
    pointer-events: none;
  }

  .title {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 2px;
    margin: 0 0 4px;
    color: #f0a4b8;
    text-shadow: 0 3px 0 #fff, 0 6px 18px rgba(240, 164, 184, 0.35);
  }

  .message {
    width: 100%;
    max-width: min(19em, 76vw);
    font-size: 20px;
    font-weight: 700;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
    gap: 0.35em;
  }

  /* 所有句子都在正常文档流里，绝不重叠；
     轮到的句子被"点亮"，其余压暗，形成一波一波的节奏。 */
  .message span {
    opacity: 0.32;
    animation: glow var(--cycle) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes glow {
    0%   { opacity: 0.32; transform: scale(1);    }
    3%   { opacity: 1;    transform: scale(1.03); }
    14%  { opacity: 1;    transform: scale(1.03); }
    17%  { opacity: 0.32; transform: scale(1);    }
    100% { opacity: 0.32; transform: scale(1);    }
  }

  @media (max-width: 420px) {
    .title { font-size: 28px; }
    .message { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .slot { animation: none; opacity: 1; }
    .message span { animation: none; }
    .message span:first-child { opacity: 1; }
  }
</style>
</head>
<body>

  <div class="dogs" aria-hidden="true">
    <span class="slot" style="left:77.1%;top:83.3%;--size:128px;--delay:0.31s;--drift:-26px">
      <img src="pups/pup01.webp" alt="" width="128" height="128" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:77.1%;top:13.7%;--size:99px;--delay:1.02s;--drift:15px">
      <img src="pups/pup02.webp" alt="" width="99" height="99" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:38.6%;top:83.3%;--size:114px;--delay:1.64s;--drift:19px">
      <img src="pups/pup03.webp" alt="" width="114" height="114" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:61.2%;top:83.3%;--size:96px;--delay:2.49s;--drift:20px">
      <img src="pups/pup04.webp" alt="" width="96" height="96" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:23.2%;top:13.7%;--size:119px;--delay:3.11s;--drift:17px">
      <img src="pups/pup05.webp" alt="" width="119" height="119" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:24.6%;top:83.3%;--size:116px;--delay:3.9s;--drift:-17px">
      <img src="pups/pup06.webp" alt="" width="116" height="116" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:22.9%;top:13.7%;--size:131px;--delay:4.85s;--drift:17px">
      <img src="pups/pup07.webp" alt="" width="131" height="131" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:76.1%;top:83.3%;--size:90px;--delay:5.56s;--drift:21px">
      <img src="pups/pup08.webp" alt="" width="90" height="90" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:43.8%;top:13.7%;--size:99px;--delay:6.28s;--drift:21px">
      <img src="pups/pup09.webp" alt="" width="99" height="99" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:55.3%;top:13.7%;--size:101px;--delay:7.09s;--drift:-23px">
      <img src="pups/pup01.webp" alt="" width="101" height="101" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:22.9%;top:83.3%;--size:125px;--delay:7.68s;--drift:-17px">
      <img src="pups/pup02.webp" alt="" width="125" height="125" loading="eager" decoding="async">
    </span>
    <span class="slot" style="left:77.1%;top:13.7%;--size:118px;--delay:8.51s;--drift:12px">
      <img src="pups/pup03.webp" alt="" width="118" height="118" loading="eager" decoding="async">
    </span>
  </div>

  <div class="center">
    <h1 class="title">生日快乐</h1>
    <div class="message">
      <span style="--delay:0.00s">生日快乐呀 🎂</span>
      <span style="--delay:1.80s">愿你今天被所有人温柔以待</span>
      <span style="--delay:3.60s">想要的都拥有，得不到的都释怀</span>
      <span style="--delay:5.40s">新的一岁，平安、健康、开心</span>
      <span style="--delay:7.20s">愿你被这个世界好好爱着 🐾</span>
    </div>
  </div>

</body>
</html>
